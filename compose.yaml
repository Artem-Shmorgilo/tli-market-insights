services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: tli_market_insights
            DB_USERNAME: tli_user
            DB_PASSWORD: local_dev_password
        depends_on:
            db:
                condition: service_healthy
        networks:
            - tli

    nginx:
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html:ro
            - vendor:/var/www/html/vendor:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - tli

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: tli_market_insights
            POSTGRES_USER: tli_user
            POSTGRES_PASSWORD: local_dev_password
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tli_user -d tli_market_insights"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - tli

    vite:
        image: node:24-alpine
        working_dir: /var/www/html
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules
        networks:
            - tli

networks:
    tli:

volumes:
    postgres_data:
    vendor:
    node_modules:
